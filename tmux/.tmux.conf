# statusbar formatting
set -g window-status-format "#W "
set -g window-status-current-format "#[reverse,bold] #(printf '%%s\n' '#W' | tr '[:lower:]' '[:upper:]') "
set -g status-position bottom
set -g status-justify centre
set -g status-left '[#H]'
set -g status-style 'fg=#282828,bg=#98971a'
set -g status-right ' %a %b %d %H:%M '
set -g status-right-length 50

# nice thick borders between panes
set -g pane-border-lines heavy

# Use border status to display current running command.
set -g pane-border-status top
# Only show border status when there are multiple panes:
set-hook -g window-layout-changed 'set-window -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g pane-border-format " #P: #{pane_current_command} "

# Update status line more often than every 15s.
set -g status-interval 1

# Every custom binding below carries -N "note". `prefix ?` runs `list-keys -N`,
# which lists ONLY bindings that have a note -- without these, none of my own
# keys showed up in the help screen.

# Kill window, pane without confirmation
bind-key -N "Kill window (no confirm)" & kill-window
bind-key -N "Kill pane (no confirm)"   x kill-pane

# edit pane content in helix in popup. wowza.
bind-key -N "Edit pane contents in helix" e display-popup -w 95% -h 90% -E "tmux capture-pane -Jp -S- | hx -"
# open popup lazygit for current dir
bind-key -N "Lazygit popup" g popup -E -w 95% -h 95%  -d '#{pane_current_path}' lazygit

# ---- Cmd-key bridge: Ghostty emits CSI (57501+N) u  <=>  tmux key UserN ----
# See the KEY BINDINGS block in ~/.config/ghostty/config. Keep the two in step.
set -s user-keys[0]  "\e[57501u"
set -s user-keys[1]  "\e[57502u"
set -s user-keys[2]  "\e[57503u"
set -s user-keys[3]  "\e[57504u"
set -s user-keys[4]  "\e[57505u"
set -s user-keys[5]  "\e[57506u"
set -s user-keys[6]  "\e[57507u"
set -s user-keys[7]  "\e[57508u"
set -s user-keys[8]  "\e[57509u"
set -s user-keys[9]  "\e[57510u"
set -s user-keys[10] "\e[57511u"
set -s user-keys[11] "\e[57512u"
set -s user-keys[12] "\e[57513u"
set -s user-keys[13] "\e[57514u"
set -s user-keys[14] "\e[57515u"
set -s user-keys[15] "\e[57516u"
set -s user-keys[16] "\e[57517u"
set -s user-keys[17] "\e[57518u"
set -s user-keys[18] "\e[57519u"
set -s user-keys[19] "\e[57520u"
set -s user-keys[20] "\e[57521u"
set -s user-keys[21] "\e[57522u"
set -s user-keys[22] "\e[57523u"

# The helix guard, written once. #{E:} expands it at the use site.
# Pure format evaluation -- no /bin/sh + grep fork per keystroke.
set -g @hx '#{m:*hx,#{pane_current_command}}'

# --- tmux-native, bound with -n (root table): no prefix needed ---
bind-key -N "Cmd+1  select window 1" -n User0 select-window -t 1
bind-key -N "Cmd+2  select window 2" -n User1 select-window -t 2
bind-key -N "Cmd+3  select window 3" -n User2 select-window -t 3
bind-key -N "Cmd+4  select window 4" -n User3 select-window -t 4
bind-key -N "Cmd+5  select window 5" -n User4 select-window -t 5
bind-key -N "Cmd+6  select window 6" -n User5 select-window -t 6
bind-key -N "Cmd+7  select window 7" -n User6 select-window -t 7
bind-key -N "Cmd+Shift+T  split pane side by side" -n User7  split-window -h
bind-key -N "Cmd+H  select pane left"  -n User8  select-pane -L
bind-key -N "Cmd+J  select pane down"  -n User9  select-pane -D
bind-key -N "Cmd+K  select pane up"    -n User10 select-pane -U
bind-key -N "Cmd+L  select pane right" -n User11 select-pane -R
bind-key -N "Cmd+W  kill pane"         -n User12 kill-pane
bind-key -N "Cmd+G  lazygit popup"     -n User13 popup -E -w 95% -h 95% -d '#{pane_current_path}' lazygit

# --- helix-only: silently dropped when the pane is not running hx/nhx ---
bind-key -N "Cmd+S  helix: save file"        -n User14 if -F '#{E:@hx}' 'send-keys Escape Escape ":w" Enter'
bind-key -N "Cmd+F  helix: search in file"   -n User15 if -F '#{E:@hx}' 'send-keys Escape Escape "/"'
bind-key -N "Cmd+B  helix: goto definition"  -n User16 if -F '#{E:@hx}' 'send-keys Escape Escape g d'
bind-key -N "Cmd+E  helix: buffer picker"    -n User17 if -F '#{E:@hx}' 'send-keys Escape Escape Space b'
bind-key -N "Cmd+C  helix: copy to clipboard" -n User18 if -F '#{E:@hx}' 'send-keys Space y'
bind-key -N "Cmd+R  helix: goto references"  -n User19 if -F '#{E:@hx}' 'send-keys Escape Escape g r'
bind-key -N "Ctrl+Shift+F  helix: global search" -n User20 if -F '#{E:@hx}' 'send-keys Escape Escape Space /'
bind-key -N "Cmd+Z  helix: undo"             -n User21 if -F '#{E:@hx}' 'send-keys Escape Escape u'
bind-key -N "Cmd+Shift+Z  helix: redo"       -n User22 if -F '#{E:@hx}' 'send-keys Escape Escape U'
