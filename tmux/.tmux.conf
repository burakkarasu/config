set -g default-terminal "tmux-256color"
# set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*-256color:Tc"

# Let programs emit DCS passthrough sequences through tmux (image protocols,
# OSC 52 clipboard from nested programs, etc).
set -g allow-passthrough on
# Extended keys (CSI u). Lets helix tell apart C-i/Tab, C-m/Enter, see Shift+Enter,
# and generally receive modified keys that plain xterm encoding cannot express.
# Does NOT interfere with the user-keys bridge below: tmux matches the user-key
# table before it tries to parse extended keys.
set -s extended-keys on
# Tell tmux the outer terminal can do extended keys. TERM here is xterm-ghostty,
# which matches xterm*.
set -as terminal-features 'xterm*:extkeys'

# Change default prefix from ctrl+B to ctrl+space
unbind C-Space # not sure if this does anything by default, but still.
set -g prefix C-Space # use ctrl+space as prefix now
bind C-Space send-prefix # useful when there are multiple sessions

# Default is 500ms, a bit much says the internet.
set -sg escape-time 10

# Enable mouse interaction
setw -g mouse on

# Increase history limit, default is a MEASLY 2k.
set-option -g history-limit 10000

# Array indexes start at 1 here and ONLY here.
set -g base-index 1 # for windows
setw -g pane-base-index 1 # for panes

# vi copy mode
set-window-option -g mode-keys vi

